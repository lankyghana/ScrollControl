
# This machine has 7GB of total RAM — -Xmx8G (the Flutter/Android Studio
# default) was larger than physically available memory and crashed the
# Gradle daemon with a native OOM ~21 minutes into a release build. Keep
# this well under total RAM, especially with Android Studio/IntelliJ also
# running their own Java daemons concurrently.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
